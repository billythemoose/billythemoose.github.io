version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*', 'satteri']
      dependencies:
        patterns: ['*']
        exclude-patterns: ['astro', '@astrojs/*', 'satteri']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
