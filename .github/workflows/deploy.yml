name: deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:urls
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1

  # Deploys to S3 + CloudFront (infra/). The role, bucket and distribution are repository
  # secrets, so GitHub masks them in the public logs; no AWS keys are stored anywhere.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Upload to S3
        env:
          BUCKET: ${{ secrets.SITE_BUCKET }}
        run: |
          # Hashed assets never change, so browsers can cache them for a year.
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --delete --only-show-errors \
            --cache-control 'public, max-age=31536000, immutable'
          # Everything else: browsers revalidate, CloudFront caches until the invalidation below.
          aws s3 sync dist "s3://$BUCKET" --delete --only-show-errors --exclude '_astro/*' \
            --cache-control 'public, max-age=0, s-maxage=86400, must-revalidate'
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ secrets.DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' > /dev/null
